header{position:fixed;left:0;top:0;bottom:0;width:var(--sw);z-index:12;background:var(--c);border-right:1px solid var(--b);padding:22px 16px;display:flex;flex-direction:column;gap:26px}

main{margin-left:var(--sw);padding:28px 36px 40px}main>*{max-width:1260px;margin-left:auto;margin-right:auto}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px;flex-wrap:wrap}

.dot{width:9px;height:9px;border-radius:50%;background:var(--m);display:inline-block;flex:none}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--w)}

.sr{position:relative}.sr svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--m)}.sr input{padding-left:44px;height:48px;box-shadow:var(--sh)}
button.b{background:var(--p);color:#fff;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
button.b:hover{filter:brightness(1.08)}button.b:active{transform:scale(.97)}
button.g{background:linear-gradient(135deg,#10b981,#059669)}button.r{background:#fee2e2;color:#dc2626}button.o{background:#fef3c7;color:#b45309}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}

table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--m);font-weight:600;font-size:12.5px;text-align:left;padding:11px 14px;background:var(--bg)}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
td{padding:13px 14px;border-bottom:1px solid var(--b)}tbody tr:hover td,tr:hover>td{background:color-mix(in srgb,var(--bg) 60%,transparent)}tr:last-child td{border:0}td[colspan]{text-align:center;color:var(--m);padding:34px 14px}
.wrap{overflow-x:auto}td .b{padding:6px 12px;font-size:13px;border-radius:9px}
.cart{align-self:start;position:sticky;top:24px}

.ovp{position:fixed;inset:0;background:#0b112080;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:60;padding:16px;animation:fi .15s}.ovp.out{opacity:0;transition:.22s}

const dLong=k=>new Date(k+'T12:00:00').toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),mLong=k=>new Date(k+'-01T12:00:00').toLocaleDateString('th-TH',{month:'long',year:'numeric'});
const RT=(h,al,rows)=>`<table><tr>${h.map((x,i)=>`<th class="${al[i]}">${x}</th>`).join('')}</tr>${rows.join('')||'<tr><td colspan="'+h.length+'" style="text-align:center;color:#6b7280">ไม่มีข้อมูล</td></tr>'}</table>`;
function rpPages(mode,key,detail){
 const l=S.sales.filter(s=>ymd(s.date).startsWith(key)).sort((a,b)=>new Date(a.date)-new Date(b.date)),a=agg(l),pages=[];
 const per=mode=='day'?dLong(key):mLong(key);
 pages.push(`<h2>รายงานสรุปยอดขาย${mode=='day'?'รายวัน':'รายเดือน'}</h2><p class="pd">${per}</p>
 <div class="rs"><div><small>ยอดขาย</small><b>฿${fmt(a.rev)}</b></div><div><small>กำไร</small><b>฿${fmt(a.rev-a.cost)}</b></div><div><small>จำนวนบิล</small><b>${a.bills}</b></div><div><small>จำนวนสินค้าที่ขาย</small><b>${fq(a.qty)}</b></div></div>
 <h4>ช่องทางชำระเงิน</h4>${RT(['ช่องทาง','ยอดขาย','สัดส่วน'],'lrr',Object.entries(a.pay).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">฿${fmt(v)}</td><td class="r">${(v/(a.rev||1)*100).toFixed(1)}%</td></tr>`))}
 <h4>สินค้าขายดี</h4>${RT(['สินค้า','จำนวน','ยอดขาย'],'lrr',a.top.slice(0,12).map(t=>`<tr><td>${esc(t.n)}</td><td class="r">${fq(t.q)}</td><td class="r">฿${fmt(t.r)}</td></tr>`))}`);
 if(mode=='month'){const days={};l.forEach(s=>(days[ymd(s.date)]=days[ymd(s.date)]||[]).push(s));
  pages.push('<h4>สรุปรายวัน</h4>'+RT(['วันที่','บิล','ยอดขาย','กำไร'],'lrrr',Object.keys(days).sort().map(k=>{const d=agg(days[k]);return `<tr><td>${new Date(k+'T12:00:00').toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'})}</td><td class="r">${d.bills}</td><td class="r">฿${fmt(d.rev)}</td><td class="r">฿${fmt(d.rev-d.cost)}</td></tr>`})))}
 if(detail){let cur=[],h=0;const fl=()=>{if(cur.length)pages.push('<h4>รายการขายละเอียด</h4>'+RT(['วันที่-เวลา','รายการ','ชำระ','ยอดรวม'],'llll',cur));cur=[];h=0};
  l.forEach(s=>{const it=(s.items||[]).map(i=>esc(i.name)+' ×'+fq(i.qty)).join(', '),rh=Math.max(1,Math.ceil(it.length/50))*17+14;if(h+rh>840)fl();
   cur.push(`<tr><td>${new Date(s.date).toLocaleString('th-TH',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td>${it}</td><td>${esc(s.pay)}</td><td class="r"><b>฿${fmt(s.total)}</b></td></tr>`);h+=rh});fl()}
 return{pages,per,n:l.length}}
const wrapP=(x,n,t,per)=>`<div class="rp"><div class="rh"><b>ร้านค้า POS</b><span>${per}</span></div>${x}<div class="rf"><span>พิมพ์เมื่อ ${new Date().toLocaleString('th-TH')}</span><span>หน้า ${n}/${t}</span></div></div>`;
const RPCSS=`.rp{width:794px;height:1123px;background:#fff;color:#111827;padding:44px 52px;box-sizing:border-box;font-family:'Sarabun',sans-serif;position:relative;overflow:hidden;font-size:14px}
.rp .rh{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #7c5cf0;padding-bottom:10px;margin-bottom:22px;font-size:15px}.rp .rh b{color:#7c5cf0;font-size:18px}.rp .rh span{color:#6b7280}
.rp h2{margin:0 0 4px;font-size:26px}.rp .pd{margin:0 0 18px;color:#4b5563;font-size:15px}.rp h4{margin:20px 0 8px;font-size:15px;color:#5b3fd1}
.rp .rs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.rp .rs div{background:#f1ecff;border-radius:10px;padding:12px}.rp .rs small{display:block;color:#6b7280;font-size:12px}.rp .rs b{font-size:19px}

`;
const lib=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function libs(){for(const[n,a,b]of [['html2canvas','lib/html2canvas.min.js','https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'],['jspdf','lib/jspdf.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js']]){if(window[n])continue;try{await lib(a);if(!window[n])throw 0}catch(e){await lib(b)}}}
async function rpFrame(R){
 const f=document.createElement('iframe');f.style.cssText='position:fixed;left:-10000px;top:0;border:0;width:794px;height:'+R.pages.length*1123+'px';
 f.srcdoc='<!DOCTYPE html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet"><style>@page{size:A4;margin:0}html,body{margin:0;background:#fff}'+RPCSS+'.rp{page-break-after:always}</style></head><body>'+R.pages.map((x,i)=>wrapP(x,i+1,R.pages.length,R.per)).join('')+'</body></html>';
 const ld=new Promise(r=>f.onload=r);document.body.appendChild(f);await ld;
 try{await Promise.race([f.contentDocument.fonts.ready,new Promise(r=>setTimeout(r,4000))])}catch(e){}
 return f}
async function makePdf(mode,key,detail){
 const R=rpPages(mode,key,detail);if(!R.n)return toast('ไม่มีรายการขายในช่วงเวลานี้');
 toast('กำลังสร้าง PDF...');let f;
 try{
  await libs();f=await rpFrame(R);
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),els=f.contentDocument.querySelectorAll('.rp');
  for(let i=0;i<els.length;i++){toast('กำลังสร้างหน้า '+(i+1)+'/'+els.length);
   const c=await html2canvas(els[i],{scale:2,backgroundColor:'#ffffff',windowWidth:794});if(i)doc.addPage();doc.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297)}
  f.remove();pdfDone(doc.output('blob'),'sales-'+(mode=='day'?'daily':'monthly')+'-'+key+'.pdf')
 }catch(e){console.error(e);toast('สร้างไฟล์ตรง ๆ ไม่ได้ กำลังเปิดหน้าพิมพ์ ให้เลือก "บันทึกเป็น PDF"');
  if(f){setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(x){toast('สร้าง PDF ไม่สำเร็จ: '+(e&&e.message||e))}},800);setTimeout(()=>f.remove(),180000)}
  else toast('สร้าง PDF ไม่สำเร็จ: '+(e&&e.message||'โหลดตัวสร้าง PDF ไม่ได้ ตรวจสอบอินเทอร์เน็ต'))}}
function pdfDone(blob,name){
 window.__pdf={blob,name};const url=URL.createObjectURL(blob),m=document.createElement('div');m.className='ov';m.onclick=e=>{if(e.target==m)m.remove()};
 m.innerHTML=`<div class="md"><h3>สร้าง PDF เรียบร้อย</h3><p style="color:var(--m);margin:0 0 14px">${esc(name)} (${Math.round(blob.size/1024)} KB)</p>
 <a class="b g" href="${url}" download="${esc(name)}" style="display:block;text-align:center;text-decoration:none">ดาวน์โหลด / เปิดไฟล์ PDF</a>
 ${navigator.canShare&&navigator.canShare({files:[new File([blob],name,{type:'application/pdf'})]})?'<button class="b" style="width:100%;margin-top:10px" onclick="sharePdf()">แชร์ / บันทึกลงเครื่อง</button>':''}
 <button class="b r" style="width:100%;margin-top:10px" onclick="this.closest('.ov').remove()">ปิด</button></div>`;document.body.appendChild(m)}
function sharePdf(){const p=window.__pdf;navigator.share({files:[new File([p.blob],p.name,{type:'application/pdf'})],title:p.name}).catch(()=>{})}
const lastDay=()=>S.sales.reduce((m,s)=>ymd(s.date)>m?ymd(s.date):m,''),has=k=>S.sales.some(s=>ymd(s.date).startsWith(k));
