main{margin-left:var(--sw);padding:28px 36px 40px}main>*{max-width:1260px;margin-left:auto;margin-right:auto}

.dot{width:9px;height:9px;border-radius:50%;background:var(--m);display:inline-block;flex:none}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--w)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}

table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--m);font-weight:600;font-size:12.5px;text-align:left;padding:11px 14px;background:var(--bg)}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
td{padding:13px 14px;border-bottom:1px solid var(--b)}tbody tr:hover td,tr:hover>td{background:color-mix(in srgb,var(--bg) 60%,transparent)}tr:last-child td{border:0}td[colspan]{text-align:center;color:var(--m);padding:34px 14px}
.wrap{overflow-x:auto}td .b{padding:6px 12px;font-size:13px;border-radius:9px}
.cart{align-self:start;position:sticky;top:24px}

.ovp{position:fixed;inset:0;background:#0b112080;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:60;padding:16px;animation:fi .15s}.ovp.out{opacity:0;transition:.22s}

<main><div class="top"><div><h2 id="ttl"></h2><p id="sub"></p></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="rf" id="rf" onclick="manual()"></button><div class="dt" id="dt"></div></div></div><div id="app"></div></main><div id="toast"></div>
<script>
const DEFAULT_API='https://script.google.com/macros/s/AKfycbyA3SBusE0UrbshW2ZnQYvdg4ZCc4tRFHoCZfpmVyNqR5Ng2NENE5Mhdn_4B0XkIHBc/exec';
let API_URL=DEFAULT_API;try{API_URL=localStorage.getItem('pos_api')||DEFAULT_API}catch(e){}
const K='pos_v2',QK='pos_q';
let S={products:[],sales:[],moves:[]},cart={},cat='ทั้งหมด',tab='pos',q='',edit=null,Q=[],busy=0,dm='day',dd='',dmo='',hd='',lt=[];
const $=s=>document.querySelector(s),fmt=n=>(+n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
dd=ymd(new Date());dmo=dd.slice(0,7);
const IC={cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20.5 8H6"/>',receipt:'<path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',coin:'<circle cx="12" cy="12" r="9"/><path d="M9.5 6v12M9.5 8h4a2 2 0 0 1 0 4h-4m0 0h4.5a2 2 0 0 1 0 4H9.5"/>',trend:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'};
Object.assign(IC,{plus:'<path d="M12 5v14M5 12h14"/>',img:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/>',arr:'<path d="M5 12h14M13 6l6 6-6 6"/>',grid:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/>',egg:'<path d="M12 3c3.5 0 6 5.5 6 9.5a6 6 0 0 1-12 0C6 8.5 8.5 3 12 3z"/>',drop:'<path d="M12 3s6 6.3 6 10.5a6 6 0 0 1-12 0C6 9.3 12 3 12 3z"/><path d="M9.5 14a2.6 2.6 0 0 0 2 2.5"/>',bowl:'<path d="M3 11h18a8 8 0 0 1-8 8h-2a8 8 0 0 1-8-8zM8 7.5c0-1.5 1-2 1-3.5M12 7.5c0-1.5 1-2 1-3.5M16 7.5c0-1.5 1-2 1-3.5"/>',refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>',store:'<path d="M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9c0 2 3 2 3 0M6 9c0 2 3 2 3 0M9 9c0 2 3 2 3 0M12 9c0 2 3 2 3 0M15 9c0 2 3 2 3 0M18 9c0 2 3 2 3 0"/>'});
const I=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const seed=()=>[
{id:'p1',name:'ไข่ไก่ เบอร์ 2 (แผง 30 ฟอง)',cat:'ไข่',price:105,cost:90,stock:40,unit:'แผง',img:''},
{id:'p2',name:'ไข่ไก่ เบอร์ 3 (แผง 30 ฟอง)',cat:'ไข่',price:98,cost:84,stock:30,unit:'แผง',img:''},
{id:'p3',name:'ข้าวสาร หอมมะลิ 5 กก.',cat:'ข้าวสาร',price:185,cost:160,stock:25,unit:'ถุง',img:''},
{id:'p4',name:'ข้าวสาร หอมมะลิ 15 กก.',cat:'ข้าวสาร',price:520,cost:470,stock:12,unit:'ถุง',img:''},
{id:'p5',name:'น้ำดื่ม 600 มล.',cat:'น้ำดื่ม',price:7,cost:4.5,stock:120,unit:'ขวด',img:''},
{id:'p6',name:'น้ำดื่ม 1.5 ลิตร',cat:'น้ำดื่ม',price:14,cost:10,stock:60,unit:'ขวด',img:''},
{id:'p7',name:'น้ำดื่มแพ็ก 12 ขวด',cat:'น้ำดื่ม',price:68,cost:55,stock:4,unit:'แพ็ก',img:''}];
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2400)}
function setApi(){const u=prompt('วาง URL ของ Apps Script Web App (ลงท้าย /exec)\nเว้นว่างเพื่อใช้ค่าเริ่มต้น',API_URL);if(u===null)return;try{u.trim()?localStorage.setItem('pos_api',u.trim()):localStorage.removeItem('pos_api')}catch(e){}location.reload()}
function logo(){const n=Date.now();lt=lt.filter(t=>n-t<1500);lt.push(n);if(lt.length>=3){lt=[];diag()}}
// ---------- sync (คิวส่งข้อมูล + ดึงข้อมูลอัตโนมัติ) ----------
function saveL(){try{localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(QK,JSON.stringify(Q))}catch(e){}}
function pend(){const e=$('#pend');if(e)e.style.display=Q.length?'inline-block':'none'}
function setRf(t,spin){const e=$('#rf');if(!e)return;e.classList.toggle('on',!!API_URL);e.innerHTML='<svg class="i'+(spin?' spin':'')+'" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>'+t}
let lastVer=null;
async function flush(first){
 if(!API_URL||busy)return;busy=1;let ok=1,wrote=0,again=0;
 try{if(Q.length)setRf('กำลังบันทึก...',1);
  while(Q.length){const d=await(await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Q[0])})).json();if(!d.ok)throw 0;Q.shift();saveL();pend();wrote=1;
   if(d.ver!==undefined&&lastVer!==null&&d.ver==lastVer+1)lastVer=d.ver;else{lastVer=null;again=1}}}
 catch(e){ok=0;setRf('ซิงค์ไม่สำเร็จ · แตะเพื่อลองใหม่');if(!flush.w||Date.now()-flush.w>30000){flush.w=Date.now();toast('ซิงค์ไม่สำเร็จ จะลองใหม่อัตโนมัติ')}}
 busy=0;pend();if(ok&&!first&&(!wrote||again))await pull();else if(ok&&wrote)setRf('อัปเดต '+new Date().toLocaleTimeString('th-TH'))}
function send(a){if(!API_URL)return;Q.push(a);saveL();pend();flush()}
const sig=d=>d.sales.map(x=>x.id+':'+x.total).join(',')+'|'+d.products.map(p=>p.id+':'+p.stock+':'+p.price+':'+p.name).join(',');
async function pull(first){
 if(!API_URL||busy||Q.length)return;
 try{
  if(!first&&lastVer!==null){const v=await(await fetch(API_URL+(API_URL.includes('?')?'&':'?')+'v=1')).json();if(v.ver!==undefined&&v.ver===lastVer){setRf('อัปเดต '+new Date().toLocaleTimeString('th-TH'));return}}
  setRf('กำลังอัปเดต...',1);
  const d=await(await fetch(API_URL)).json();lastVer=d.ver===undefined?null:d.ver;
  const n={products:(d.products||[]).map(p=>({id:String(p.id),name:p.name,cat:p.cat,price:+p.price,cost:+p.cost,stock:+p.stock,unit:p.unit,img:p.img||''})),sales:d.sales||[],moves:d.moves||[]};
  if(first&&!n.products.length&&S.products.length){send({action:'seed',products:S.products});return}
  if(JSON.stringify(n)!=JSON.stringify(S)){const ch=!first&&sig(n)!=sig(S);S=n;saveL();refresh();if(ch)toast('อัปเดตข้อมูลล่าสุดจากเครื่องอื่นแล้ว')}
  setRf('อัปเดต '+new Date().toLocaleTimeString('th-TH'))}catch(e){setRf('เชื่อมต่อไม่ได้ · แตะเพื่อลองใหม่')}}
const sync=()=>flush();
function manual(){if(busy)return toast('กำลังซิงค์อยู่');flush()}
function refresh(){
 Object.keys(cart).forEach(id=>{const p=P(id);if(!p||p.stock<=0)delete cart[id];else if(cart[id]>p.stock)cart[id]=p.stock});
 if(tab=='pos'){const b=$('#bn');if(b)b.innerHTML=bnIn();grid();cartUI()}else if(tab=='prod')ptab();else render()}
async function load(){
 try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.products)S={moves:[],sales:[],...d};Q=JSON.parse(localStorage.getItem(QK)||'[]')}catch(e){}
 if(!S.products.length)S.products=seed();
 render();pend();
 if(API_URL){setRf('กำลังโหลด...',1);await flush(1);await pull(true);setInterval(()=>{if(!document.hidden)sync()},5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});addEventListener('focus',sync);addEventListener('online',sync)}}
// ---------- helpers ----------
const hue=t=>[...String(t||'')].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%55;
const icon=p=>/^(data:|http)/.test(p.img||'')?`<img src="${esc(p.img)}" alt="">`:`<span class="tile" style="--h:${hue(p.cat)}">${I(catIc(p.cat))}</span>`;
const cats=()=>['ทั้งหมด',...new Set(S.products.map(p=>p.cat).filter(Boolean))];
const P=id=>S.products.find(p=>p.id==id);
const cartTotal=()=>Object.entries(cart).reduce((s,[id,n])=>s+(P(id)?.price||0)*n,0);
function render(top){const y=scrollY;document.body.classList.remove('lock');
 $('#nav').innerHTML=[['pos','cart','ขายสินค้า'],['hist','receipt','ประวัติการขาย'],['dash','chart','สรุปยอดขาย'],['prod','box','สินค้า / สต็อก']].map(([k,ic,l])=>`<button class="k-${k} ${tab==k?'on':''}" onclick="tab='${k}';render(1)">${I(ic)}<span>${l}</span></button>`).join('')+(API_URL?`<button class="k-rf" onclick="manual()">${I('refresh')}<span>รีเฟรช</span></button>`:'');
 const T={pos:['ขายสินค้า','เลือกสินค้าเข้าตะกร้าและรับชำระเงิน'],hist:['ประวัติการขาย','ดูบิลย้อนหลังและกรองตามวันที่'],dash:['สรุปยอดขาย','ยอดขาย กำไร และสินค้าขายดี รายวัน/รายเดือน'],prod:['สินค้า / สต็อก','เพิ่ม แก้ไขสินค้า และปรับสต็อก']}[tab];
 $('#ttl').textContent=T[0];$('#sub').textContent=T[1];$('#dt').textContent=new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 ({pos:vPos,hist:vHist,dash:vDash,prod:vProd})[tab]();top?scrollTo(0,0):scrollTo(0,y)}
// ---------- ขายสินค้า ----------
function vPos(){
 $('#app').innerHTML=`<div class="pos"><div><div class="bn" id="bn">${bnIn()}</div><div class="sr">${I('search')}<input id="qs" placeholder="ค้นหาสินค้า หรือสแกนบาร์โค้ด" value="${esc(q)}"></div>
 <div class="cats">${cats().map(c=>`<button class="cat ${c==cat?'on':''}" onclick="cat='${esc(c)}';render()"><span>${I(catIc(c))}</span><small>${esc(c)}</small></button>`).join('')}</div><div class="sec"><h3>${cat=='ทั้งหมด'?'สินค้าทั้งหมด':esc(cat)}</h3><span id="gc"></span></div><div class="grid" id="g"></div></div>
 <div class="card cart"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0 0 6px">ตะกร้าสินค้า</h3><button class="b r xs" onclick="tgc()">ปิด</button></div><div id="cl"></div>
 <div class="tot" id="tt"></div>
 <div class="f" style="margin:10px 0"><div><label>ช่องทางชำระ</label><select id="pay"><option>เงินสด</option><option>QR พร้อมเพย์</option><option>โอนเงิน</option></select></div><div><label>รับเงินมา</label><input id="rc" type="number" min="0" inputmode="decimal" oninput="chg()"></div></div>
 <div id="chg" style="text-align:right;margin-bottom:8px;color:var(--m)"></div>
 <div style="display:flex;gap:8px"><button class="b r" onclick="cart={};render()">ล้าง</button><button class="b g" style="flex:1;font-size:18px" onclick="checkout()">ชำระเงิน</button></div></div></div>
 <button class="cb b" onclick="tgc()"><span id="cbn"></span><b id="cbt"></b></button>`;
 $('#qs').oninput=e=>{q=e.target.value;grid()};
 $('#qs').onkeydown=e=>{if(e.key=='Enter'){const p=S.products.find(p=>p.id==q.trim()||p.name==q.trim());if(p){add(p.id);q='';e.target.value='';grid()}}};
 grid();cartUI()}
const tgc=()=>{const c=$('.cart');c.classList.toggle('open');document.body.classList.toggle('lock',c.classList.contains('open'))};
const catIc=c=>c=='ทั้งหมด'?'grid':/ไข่/.test(c)?'egg':/ข้าว|แป้ง|เมล็ด|ธัญ/.test(c)?'bowl':/น้ำ|เครื่องดื่ม|นม/.test(c)?'drop':'box';
function best(){if(best.k===S.sales.length&&best.v)return best.v;const m={};S.sales.forEach(s=>(s.items||[]).forEach(i=>m[i.id]=(m[i.id]||0)+i.qty));best.k=S.sales.length;return best.v=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>String(x[0]))}
function bnIn(){const k=ymd(new Date()),a=agg(S.sales.filter(s=>ymd(s.date)==k));return `<div><small>ยอดขายวันนี้</small><b>฿${fmt(a.rev)}</b><p>${a.bills} บิล · กำไร ฿${fmt(a.rev-a.cost)}</p><button class="bb" onclick="tab='dash';render(1)">ดูสรุปยอดขาย ${I('arr')}</button></div><span class="bgi">${I('store')}</span>`}
function grid(){
 const l=S.products.filter(p=>(cat=='ทั้งหมด'||p.cat==cat)&&(!q||(p.name+p.id).toLowerCase().includes(q.toLowerCase()))),bs=best();
 $('#g').innerHTML=l.map(p=>{const n=cart[p.id]||0,bd=p.stock<=0?['หมด','gr']:p.stock<=5?['ใกล้หมด','or']:bs.includes(String(p.id))?['ขายดี','rd']:null;
  return `<div class="pr ${p.stock<=0?'out':''}" onclick="add('${p.id}')">${bd?`<i class="bdg ${bd[1]}">${bd[0]}</i>`:''}<div class="ic">${icon(p)}</div><b>${esc(p.name)}</b><small>คงเหลือ ${p.stock} ${esc(p.unit)}</small><div class="pf"><span class="p">฿${fmt(p.price)}</span><span class="ad ${n?'n':''}">${n||I('plus')}</span></div></div>`}).join('')||'<p>ไม่พบสินค้า</p>';
 const g=$('#gc');if(g)g.textContent=l.length+' รายการ'}
function add(id){const p=P(id);if((cart[id]||0)+1>p.stock)return toast('สต็อกไม่พอ: '+p.name);cart[id]=(cart[id]||0)+1;cartUI()}
function qty(id,d){const n=(cart[id]||0)+d;if(n<=0)delete cart[id];else if(n>P(id).stock)return toast('สต็อกไม่พอ');else cart[id]=n;cartUI()}
function cartUI(){
 const e=Object.entries(cart);$('#cl').innerHTML=e.map(([id,n])=>{const p=P(id);return `<div class="ci"><span>${esc(p.name)}<br><small>฿${fmt(p.price)} × ${n}</small></span><button onclick="qty('${id}',-1)">−</button><b>${n}</b><button onclick="qty('${id}',1)">+</button></div>`}).join('')||'<p style="color:var(--m)">ยังไม่มีสินค้า</p>';
 $('#tt').textContent='฿'+fmt(cartTotal());$('#cbn').textContent='ตะกร้า ('+e.reduce((a,[,n])=>a+n,0)+')';$('#cbt').textContent='฿'+fmt(cartTotal());chg();grid()}
function chg(){const r=+($('#rc')?.value||0),t=cartTotal();if($('#chg'))$('#chg').textContent=r?(r>=t?'เงินทอน ฿'+fmt(r-t):'ขาดอีก ฿'+fmt(t-r)):''}
function checkout(){
 const e=Object.entries(cart);if(!e.length)return toast('ยังไม่มีสินค้าในตะกร้า');
 const t=cartTotal(),r=+$('#rc').value||t,pay=$('#pay').value;if(pay=='เงินสด'&&r<t)return toast('รับเงินไม่พอ');
 const sale={id:'S'+Date.now(),date:new Date().toISOString(),items:e.map(([id,n])=>{const p=P(id);p.stock-=n;return{id,name:p.name,qty:n,price:p.price,cost:p.cost}}),total:t,pay,received:r};
 S.sales.push(sale);saveL();cart={};send({action:'sale',sale});
 pop('ok','ชำระเงินเรียบร้อย','ยอดรวม ฿'+fmt(t)+(pay=='เงินสด'&&r>t?' · เงินทอน ฿'+fmt(r-t):''),2200);render()}
// ---------- ประวัติ / สรุปยอด ----------
function agg(l){const it={},pay={};let rev=0,cost=0,qty=0;l.forEach(s=>{rev+=+s.total;pay[s.pay]=(pay[s.pay]||0)+ +s.total;(s.items||[]).forEach(i=>{cost+=i.cost*i.qty;qty+=i.qty;const o=it[i.name]=it[i.name]||{n:i.name,q:0,r:0};o.q+=i.qty;o.r+=i.qty*i.price})});return{rev,cost,qty,bills:l.length,pay,top:Object.values(it).sort((a,b)=>b.r-a.r)}}
function vHist(){

 <h4>ช่องทางชำระเงิน</h4>${RT(['ช่องทาง','ยอดขาย','สัดส่วน'],'lrr',Object.entries(a.pay).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">฿${fmt(v)}</td><td class="r">${(v/(a.rev||1)*100).toFixed(1)}%</td></tr>`))}
 <h4>สินค้าขายดี</h4>${RT(['สินค้า','จำนวน','ยอดขาย'],'lrr',a.top.slice(0,12).map(t=>`<tr><td>${esc(t.n)}</td><td class="r">${t.q}</td><td class="r">฿${fmt(t.r)}</td></tr>`))}`);
 if(mode=='month'){const days={};l.forEach(s=>(days[ymd(s.date)]=days[ymd(s.date)]||[]).push(s));
  pages.push('<h4>สรุปรายวัน</h4>'+RT(['วันที่','บิล','ยอดขาย','กำไร'],'lrrr',Object.keys(days).sort().map(k=>{const d=agg(days[k]);return `<tr><td>${new Date(k+'T12:00:00').toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'})}</td><td class="r">${d.bills}</td><td class="r">฿${fmt(d.rev)}</td><td class="r">฿${fmt(d.rev-d.cost)}</td></tr>`})))}
 if(detail){let cur=[],h=0;const fl=()=>{if(cur.length)pages.push('<h4>รายการขายละเอียด</h4>'+RT(['วันที่-เวลา','รายการ','ชำระ','ยอดรวม'],'llll',cur));cur=[];h=0};
  l.forEach(s=>{const it=(s.items||[]).map(i=>esc(i.name)+' ×'+i.qty).join(', '),rh=Math.max(1,Math.ceil(it.length/50))*17+14;if(h+rh>840)fl();
   cur.push(`<tr><td>${new Date(s.date).toLocaleString('th-TH',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td>${it}</td><td>${esc(s.pay)}</td><td class="r"><b>฿${fmt(s.total)}</b></td></tr>`);h+=rh});fl()}
 return{pages,per,n:l.length}}
const wrapP=(x,n,t,per)=>`<div class="rp"><div class="rh"><b>ร้านค้า POS</b><span>${per}</span></div>${x}<div class="rf"><span>พิมพ์เมื่อ ${new Date().toLocaleString('th-TH')}</span><span>หน้า ${n}/${t}</span></div></div>`;
const RPCSS=`.rp{width:794px;height:1123px;background:#fff;color:#111827;padding:44px 52px;box-sizing:border-box;font-family:'Sarabun',sans-serif;position:relative;overflow:hidden;font-size:14px}
.rp .rh{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #e11d2e;padding-bottom:10px;margin-bottom:22px;font-size:15px}.rp .rh b{color:#e11d2e;font-size:18px}.rp .rh span{color:#6b7280}
.rp h2{margin:0 0 4px;font-size:26px}.rp .pd{margin:0 0 18px;color:#4b5563;font-size:15px}.rp h4{margin:20px 0 8px;font-size:15px;color:#b91c1c}
.rp .rs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.rp .rs div{background:#fdecea;border-radius:10px;padding:12px}.rp .rs small{display:block;color:#6b7280;font-size:12px}.rp .rs b{font-size:19px}
.rp table{width:100%;border-collapse:collapse;font-size:13px}.rp th{background:#fdecea;color:#374151;padding:8px 10px;text-align:left;border-radius:0}.rp td{padding:7px 10px;border-bottom:1px solid #e5e7eb;color:#111827;background:#fff;line-height:1.35}
.rp .r{text-align:right}.rp .l{text-align:left}.rp .rf{position:absolute;left:52px;right:52px;bottom:28px;display:flex;justify-content:space-between;color:#9ca3af;font-size:12px}
`;
const lib=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function libs(){for(const[n,a,b]of [['html2canvas','lib/html2canvas.min.js','https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'],['jspdf','lib/jspdf.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js']]){if(window[n])continue;try{await lib(a);if(!window[n])throw 0}catch(e){await lib(b)}}}
async function rpFrame(R){
 const f=document.createElement('iframe');f.style.cssText='position:fixed;left:-10000px;top:0;border:0;width:794px;height:'+R.pages.length*1123+'px';
 f.srcdoc='<!DOCTYPE html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet"><style>@page{size:A4;margin:0}html,body{margin:0;background:#fff}'+RPCSS+'.rp{page-break-after:always}</style></head><body>'+R.pages.map((x,i)=>wrapP(x,i+1,R.pages.length,R.per)).join('')+'</body></html>';
 const ld=new Promise(r=>f.onload=r);document.body.appendChild(f);await ld;
 try{await Promise.race([f.contentDocument.fonts.ready,new Promise(r=>setTimeout(r,4000))])}catch(e){}
 return f}
async function makePdf(mode,key,detail){
 const R=rpPages(mode,key,detail);if(!R.n)return toast('ไม่มีรายการขายในช่วงเวลานี้');
 toast('กำลังสร้าง PDF...');let f;
 try{
  await libs();f=await rpFrame(R);
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),els=f.contentDocument.querySelectorAll('.rp');
  for(let i=0;i<els.length;i++){toast('กำลังสร้างหน้า '+(i+1)+'/'+els.length);
   const c=await html2canvas(els[i],{scale:2,backgroundColor:'#ffffff',windowWidth:794});if(i)doc.addPage();doc.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297)}
  f.remove();pdfDone(doc.output('blob'),'sales-'+(mode=='day'?'daily':'monthly')+'-'+key+'.pdf')
 }catch(e){console.error(e);toast('สร้างไฟล์ตรง ๆ ไม่ได้ กำลังเปิดหน้าพิมพ์ ให้เลือก "บันทึกเป็น PDF"');
  if(f){setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(x){toast('สร้าง PDF ไม่สำเร็จ: '+(e&&e.message||e))}},800);setTimeout(()=>f.remove(),180000)}
  else toast('สร้าง PDF ไม่สำเร็จ: '+(e&&e.message||'โหลดตัวสร้าง PDF ไม่ได้ ตรวจสอบอินเทอร์เน็ต'))}}
function pdfDone(blob,name){
 window.__pdf={blob,name};const url=URL.createObjectURL(blob),m=document.createElement('div');m.className='ov';m.onclick=e=>{if(e.target==m)m.remove()};
 m.innerHTML=`<div class="md"><h3>สร้าง PDF เรียบร้อย</h3><p style="color:var(--m);margin:0 0 14px">${esc(name)} (${Math.round(blob.size/1024)} KB)</p>
 <a class="b g" href="${url}" download="${esc(name)}" style="display:block;text-align:center;text-decoration:none">ดาวน์โหลด / เปิดไฟล์ PDF</a>
 ${navigator.canShare&&navigator.canShare({files:[new File([blob],name,{type:'application/pdf'})]})?'<button class="b" style="width:100%;margin-top:10px" onclick="sharePdf()">แชร์ / บันทึกลงเครื่อง</button>':''}
 <button class="b r" style="width:100%;margin-top:10px" onclick="this.closest('.ov').remove()">ปิด</button></div>`;document.body.appendChild(m)}
function sharePdf(){const p=window.__pdf;navigator.share({files:[new File([p.blob],p.name,{type:'application/pdf'})],title:p.name}).catch(()=>{})}
const lastDay=()=>S.sales.reduce((m,s)=>ymd(s.date)>m?ymd(s.date):m,''),has=k=>S.sales.some(s=>ymd(s.date).startsWith(k));
function pmChg(){const m=$('#pm').value,i=$('#pk'),L=lastDay()||dd;i.type=m=='day'?'date':'month';i.value=m=='day'?(hd||(has(dd)?dd:L)):(has(dmo)?dmo:L.slice(0,7));pcnt()}
function pcnt(){const k=$('#pk').value,l=S.sales.filter(s=>k&&ymd(s.date).startsWith(k)),b=$('#pgo');
 $('#pc').innerHTML=l.length?'พบ <b>'+l.length+'</b> บิล ยอดรวม <b>฿'+fmt(l.reduce((a,s)=>a+ +s.total,0))+'</b>':'<span style="color:var(--bad)">ไม่มีรายการขายในช่วงเวลานี้ กรุณาเลือกวัน/เดือนอื่น</span>';b.disabled=!l.length;b.style.opacity=l.length?1:.5}
function pdfDlg(){
 const m=document.createElement('div');m.className='ov';m.onclick=e=>{if(e.target==m)m.remove()};
 m.innerHTML=`<div class="md"><h3>ส่งออกสรุปยอดขายเป็น PDF</h3><div class="f"><div><label>ประเภทรายงาน</label><select id="pm" onchange="pmChg()"><option value="day">รายวัน</option><option value="month">รายเดือน</option></select></div><div><label>เลือกช่วงเวลา</label><input id="pk" oninput="pcnt()" onchange="pcnt()"></div></div>
 <div id="pc" style="margin-top:14px"></div>
 <label style="display:flex;gap:10px;align-items:center;margin-top:14px"><input type="checkbox" id="pdt" checked style="width:20px;height:20px">รวมรายการขายละเอียด</label>
 <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px"><button class="b r" onclick="this.closest('.ov').remove()">ยกเลิก</button><button class="b g" id="pgo" onclick="pdfGo()">สร้างไฟล์ PDF</button></div></div>`;
 document.body.appendChild(m);$('#pm').value=dm;pmChg()}
function pdfGo(){const m=$('#pm').value,k=$('#pk').value,d=$('#pdt').checked;if(!k)return toast('เลือกช่วงเวลา');$('.ov').remove();makePdf(m,k,d)}

async function diag(){
 const rows=[],add=(ok,t,d='')=>rows.push(`<div class="dg"><i class="dot ${ok?'ok':'bad'}"></i><div><b>${t}</b><small>${d}</small></div></div>`);
 const m=document.createElement('div');m.className='ov';m.onclick=e=>{if(e.target==m)m.remove()};document.body.appendChild(m);
 const show=x=>m.innerHTML=`<div class="md"><h3>ตรวจสอบการเชื่อมต่อ</h3>${x}<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="b r" onclick="setApi()">เปลี่ยน URL</button><button class="b" onclick="this.closest('.ov').remove()">ปิด</button></div></div>`;
 show('<p>กำลังตรวจสอบ...</p>');
 add(!!API_URL,'ตั้งค่า URL Apps Script',API_URL?'ตั้งค่าแล้ว':'ยังไม่ได้ตั้งค่า');
 if(API_URL){try{const t=Date.now(),d=await(await fetch(API_URL)).json();add(true,'อ่านข้อมูลจากชีต','สินค้า '+d.products.length+' รายการ, บิลขาย '+d.sales.length+' รายการ ('+(Date.now()-t)+' ms)');
  try{const p=await(await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'ping'})})).json();add(!!p.ok,'ส่งข้อมูลไปยัง Apps Script (POST)',p.sheet?'ไฟล์ชีต: '+esc(p.sheet):'');
   if(p.folder===undefined)add(false,'Code.gs เวอร์ชันเก่า','วางโค้ดใหม่แล้ว Deploy เป็นเวอร์ชันใหม่');else add(!!p.folder,'โฟลเดอร์ Google Drive',p.folder?esc(p.folder):'เข้าถึงโฟลเดอร์ไม่ได้');
   add(Q.length==0,'คิวรอซิงค์',Q.length?Q.length+' รายการรอส่ง':'ไม่มีค้าง')}
  catch(e){add(false,'ส่งข้อมูลไปยัง Apps Script (POST)','ไม่สำเร็จ')}}
  catch(e){add(false,'อ่านข้อมูลจากชีต','เชื่อมต่อไม่ได้: ตรวจว่า Deploy เป็น Anyone และ URL ลงท้าย /exec')}}
 show(rows.join(''))}
