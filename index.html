<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ร้านค้า POS</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--c:#fff;--t:#0f1b33;--m:#64748b;--b:#e5e9f2;--p:#4f46e5;--p2:#06b6d4;--ok:#10b981;--bad:#ef4444;--w:#f59e0b;--sh:0 1px 2px rgba(15,27,51,.05),0 8px 24px rgba(15,27,51,.06);--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#0b1120;--c:#131c31;--t:#e8edf8;--m:#8d9bb5;--b:#222e49;--sh:0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}body{margin:0;font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:15px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--c) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--b);padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}.brand h1{margin:0;font-size:19px;font-weight:700}
.lg{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px;flex-wrap:wrap}
nav button{display:flex;align-items:center;gap:7px;background:none;border:0;color:var(--m);padding:8px 14px;border-radius:9px;font:inherit;font-weight:500;cursor:pointer;transition:.15s}
nav button:hover{color:var(--t)}nav button.on{background:var(--c);color:var(--p);box-shadow:var(--sh)}
.hr{margin-left:auto;display:flex;gap:8px;align-items:center}
.sy{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--m);cursor:pointer;padding:7px 12px;border-radius:99px;background:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--m);display:inline-block;flex:none}.dot.ok{background:var(--ok);box-shadow:0 0 0 3px #10b98133}.dot.bad{background:var(--bad)}.dot.warn{background:var(--w)}
main{padding:18px 20px;max-width:1360px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.pos{display:grid;grid-template-columns:1fr 380px;gap:18px}@media(max-width:900px){.pos{grid-template-columns:1fr}}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--b);border-radius:12px;background:var(--c);color:var(--t);width:100%;outline:0;transition:.15s}
input:focus,select:focus{border-color:var(--p);box-shadow:0 0 0 3px #4f46e522}
.sr{position:relative}.sr svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--m)}.sr input{padding-left:42px;height:46px;box-shadow:var(--sh)}
button.b{background:var(--p);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
button.b:hover{filter:brightness(1.08);transform:translateY(-1px)}
button.g{background:linear-gradient(135deg,#10b981,#059669)}button.r{background:#fee2e2;color:#dc2626}button.o{background:#fef3c7;color:#b45309}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{padding:7px 16px;border-radius:99px;border:1px solid var(--b);background:var(--c);color:var(--m);cursor:pointer;font:inherit;font-weight:500}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.pr{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:14px;cursor:pointer;box-shadow:var(--sh);transition:.15s}
.pr:hover{transform:translateY(-3px);border-color:var(--p)}.pr.out{opacity:.45;pointer-events:none}
.ic{height:84px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}.ic img{max-height:84px;max-width:100%;border-radius:12px;object-fit:cover}
.tile{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;font-size:32px;font-weight:700;background:hsl(var(--h) 85% 92%);color:hsl(var(--h) 60% 38%)}
.pr b{display:block;font-size:14px;font-weight:600;min-height:38px;line-height:1.3}.pr .p{color:var(--p);font-weight:700;font-size:18px;margin-top:4px}.pr small{color:var(--m)}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--m);font-weight:600;font-size:12px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--b)}
td{padding:12px;border-bottom:1px solid var(--b)}tr:last-child td{border:0}.wrap{overflow-x:auto}td .b{padding:6px 11px;font-size:13px;border-radius:9px}
.ci{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--b)}.ci span{flex:1;font-size:14px}
.ci button{width:30px;height:30px;border-radius:9px;border:1px solid var(--b);background:var(--bg);color:var(--t);cursor:pointer;font-size:16px}
.tot{font-size:36px;font-weight:700;text-align:right;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.st{background:var(--a);border-radius:var(--r);padding:18px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh)}
.st::after{content:"";position:absolute;right:-24px;top:-24px;width:96px;height:96px;border-radius:50%;background:#ffffff30}
.st small{opacity:.9}.st div{font-size:26px;font-weight:700;margin-top:4px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end}.f label{font-size:12px;color:var(--m);font-weight:500;display:block;margin-bottom:4px}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;color:#fff;font-weight:600}
.ov{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:20;padding:16px}.md{background:var(--c);border-radius:20px;padding:22px;width:min(480px,100%)}
.md h3{margin:0 0 12px}.dg{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--b);align-items:flex-start}.dg .dot{margin-top:6px}.dg small{display:block;color:var(--m)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:11px 20px;border-radius:99px;display:none;z-index:30;box-shadow:var(--sh)}

.cart{align-self:start;position:sticky;top:76px}.cb,.xs{display:none}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-bottom:18px}
.bar{height:10px;background:var(--bg);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:9px}
@media(max-width:900px){.cart{display:none;position:fixed;inset:auto 0 0 0;top:auto;z-index:15;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px #0005}.cart.open{display:block}.cb{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:14;justify-content:space-between;align-items:center;padding:15px 20px;font-size:17px;box-shadow:0 8px 24px #4f46e566}.xs{display:block}main{padding-bottom:90px}}
@media(max-width:700px){header{padding:8px 12px;gap:8px}nav{width:100%;overflow-x:auto;flex-wrap:nowrap}nav button{padding:9px 12px;white-space:nowrap;font-size:14px}main{padding:12px 12px 90px}.grid{grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:10px}input,select{font-size:16px}.tot{font-size:30px}.ci button{width:38px;height:38px}.md{padding:18px}}
</style>
</head><body>
<header><div class="brand" onclick="logo()" style="user-select:none"><span class="lg"><svg class="i" style="width:22px;height:22px" viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9c0 2 3 2 3 0M6 9c0 2 3 2 3 0M9 9c0 2 3 2 3 0M12 9c0 2 3 2 3 0M15 9c0 2 3 2 3 0M18 9c0 2 3 2 3 0"/></svg></span><h1>ร้านค้า POS</h1><i id="pend" class="dot warn" style="display:none" title="รอซิงค์"></i></div><nav id="nav"></nav></header>
<main id="app"></main><div id="toast"></div>
<script>
const DEFAULT_API='https://script.google.com/macros/s/AKfycbyA3SBusE0UrbshW2ZnQYvdg4ZCc4tRFHoCZfpmVyNqR5Ng2NENE5Mhdn_4B0XkIHBc/exec';
let API_URL=DEFAULT_API;try{API_URL=localStorage.getItem('pos_api')||DEFAULT_API}catch(e){}
const K='pos_v2',QK='pos_q';
let S={products:[],sales:[],moves:[]},cart={},cat='ทั้งหมด',tab='pos',q='',edit=null,Q=[],busy=0,dm='day',dd='',dmo='',hd='',lt=[];
const $=s=>document.querySelector(s),fmt=n=>(+n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
dd=ymd(new Date());dmo=dd.slice(0,7);
const IC={cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20.5 8H6"/>',receipt:'<path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'};
const I=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const seed=()=>[
{id:'p1',name:'ไข่ไก่ เบอร์ 2 (แผง 30 ฟอง)',cat:'ไข่',price:105,cost:90,stock:40,unit:'แผง',img:''},
{id:'p2',name:'ไข่ไก่ เบอร์ 3 (แผง 30 ฟอง)',cat:'ไข่',price:98,cost:84,stock:30,unit:'แผง',img:''},
{id:'p3',name:'ข้าวสาร หอมมะลิ 5 กก.',cat:'ข้าวสาร',price:185,cost:160,stock:25,unit:'ถุง',img:''},
{id:'p4',name:'ข้าวสาร หอมมะลิ 15 กก.',cat:'ข้าวสาร',price:520,cost:470,stock:12,unit:'ถุง',img:''},
{id:'p5',name:'น้ำดื่ม 600 มล.',cat:'น้ำดื่ม',price:7,cost:4.5,stock:120,unit:'ขวด',img:''},
{id:'p6',name:'น้ำดื่ม 1.5 ลิตร',cat:'น้ำดื่ม',price:14,cost:10,stock:60,unit:'ขวด',img:''},
{id:'p7',name:'น้ำดื่มแพ็ก 12 ขวด',cat:'น้ำดื่ม',price:68,cost:55,stock:4,unit:'แพ็ก',img:''}];
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2400)}
function setApi(){const u=prompt('วาง URL ของ Apps Script Web App (ลงท้าย /exec)\nเว้นว่างเพื่อใช้ค่าเริ่มต้น',API_URL);if(u===null)return;try{u.trim()?localStorage.setItem('pos_api',u.trim()):localStorage.removeItem('pos_api')}catch(e){}location.reload()}
function logo(){const n=Date.now();lt=lt.filter(t=>n-t<1500);lt.push(n);if(lt.length>=3){lt=[];diag()}}
// ---------- sync (คิวส่งข้อมูล + ดึงข้อมูลอัตโนมัติ) ----------
function saveL(){try{localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(QK,JSON.stringify(Q))}catch(e){}}
function pend(){const e=$('#pend');if(e)e.style.display=Q.length?'inline-block':'none'}
async function flush(){
 if(!API_URL||busy)return;busy=1;
 try{while(Q.length){const d=await(await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Q[0])})).json();if(!d.ok)throw 0;Q.shift();saveL();pend()}}
 catch(e){if(!flush.w||Date.now()-flush.w>30000){flush.w=Date.now();toast('ซิงค์ไม่สำเร็จ จะลองใหม่อัตโนมัติ')}}
 busy=0;pend()}
function send(a){if(!API_URL)return;Q.push(a);saveL();pend();flush()}
async function pull(first){
 if(!API_URL||busy||Q.length)return;
 try{const d=await(await fetch(API_URL)).json();
  const n={products:(d.products||[]).map(p=>({id:String(p.id),name:p.name,cat:p.cat,price:+p.price,cost:+p.cost,stock:+p.stock,unit:p.unit,img:p.img||''})),sales:d.sales||[],moves:d.moves||[]};
  if(first&&!n.products.length&&S.products.length){send({action:'seed',products:S.products});return}
  if(JSON.stringify(n)!=JSON.stringify(S)){S=n;saveL();refresh()}}catch(e){}}
const sync=()=>flush().then(()=>pull());
function refresh(){
 Object.keys(cart).forEach(id=>{const p=P(id);if(!p||p.stock<=0)delete cart[id];else if(cart[id]>p.stock)cart[id]=p.stock});
 if(tab=='pos'){grid();cartUI()}else if(tab=='prod')ptab();else render()}
async function load(){
 try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.products)S={moves:[],sales:[],...d};Q=JSON.parse(localStorage.getItem(QK)||'[]')}catch(e){}
 if(!S.products.length)S.products=seed();
 render();pend();
 if(API_URL){await flush();await pull(true);setInterval(sync,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});addEventListener('online',sync)}}
// ---------- helpers ----------
const hue=t=>[...String(t||'')].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
const icon=p=>/^(data:|http)/.test(p.img||'')?`<img src="${esc(p.img)}" alt="">`:`<span class="tile" style="--h:${hue(p.cat)}">${esc((String(p.name||'').match(/[ก-ฮA-Za-z0-9]/)||['?'])[0])}</span>`;
const cats=()=>['ทั้งหมด',...new Set(S.products.map(p=>p.cat).filter(Boolean))];
const P=id=>S.products.find(p=>p.id==id);
const cartTotal=()=>Object.entries(cart).reduce((s,[id,n])=>s+(P(id)?.price||0)*n,0);
function render(){
 $('#nav').innerHTML=[['pos','cart','ขายสินค้า'],['hist','receipt','ประวัติการขาย'],['dash','chart','สรุปยอดขาย'],['prod','box','สินค้า / สต็อก']].map(([k,ic,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${I(ic)}<span>${l}</span></button>`).join('');
 ({pos:vPos,hist:vHist,dash:vDash,prod:vProd})[tab]();scrollTo(0,0)}
// ---------- ขายสินค้า ----------
function vPos(){
 $('#app').innerHTML=`<div class="pos"><div><div class="sr">${I('search')}<input id="qs" placeholder="ค้นหาสินค้า หรือสแกนบาร์โค้ด แล้วกด Enter" value="${esc(q)}"></div>
 <div class="chips">${cats().map(c=>`<button class="chip ${c==cat?'on':''}" onclick="cat='${esc(c)}';render()">${esc(c)}</button>`).join('')}</div><div class="grid" id="g"></div></div>
 <div class="card cart"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0 0 6px">ตะกร้าสินค้า</h3><button class="b r xs" onclick="tgc()">ปิด</button></div><div id="cl"></div>
 <div class="tot" id="tt"></div>
 <div class="f" style="margin:10px 0"><div><label>ช่องทางชำระ</label><select id="pay"><option>เงินสด</option><option>QR พร้อมเพย์</option><option>โอนเงิน</option></select></div><div><label>รับเงินมา</label><input id="rc" type="number" min="0" inputmode="decimal" oninput="chg()"></div></div>
 <div id="chg" style="text-align:right;margin-bottom:8px;color:var(--m)"></div>
 <div style="display:flex;gap:8px"><button class="b r" onclick="cart={};render()">ล้าง</button><button class="b g" style="flex:1;font-size:18px" onclick="checkout()">ชำระเงิน</button></div></div></div>
 <button class="cb b" onclick="tgc()"><span id="cbn"></span><b id="cbt"></b></button>`;
 $('#qs').oninput=e=>{q=e.target.value;grid()};
 $('#qs').onkeydown=e=>{if(e.key=='Enter'){const p=S.products.find(p=>p.id==q.trim()||p.name==q.trim());if(p){add(p.id);q='';e.target.value='';grid()}}};
 grid();cartUI()}
const tgc=()=>$('.cart').classList.toggle('open');
function grid(){
 const l=S.products.filter(p=>(cat=='ทั้งหมด'||p.cat==cat)&&(!q||(p.name+p.id).toLowerCase().includes(q.toLowerCase())));
 $('#g').innerHTML=l.map(p=>`<div class="pr ${p.stock<=0?'out':''}" onclick="add('${p.id}')"><div class="ic">${icon(p)}</div><b>${esc(p.name)}</b><div class="p">฿${fmt(p.price)}</div><small>${p.stock<=0?'สินค้าหมด':'คงเหลือ '+p.stock+' '+esc(p.unit)}</small></div>`).join('')||'<p>ไม่พบสินค้า</p>'}
function add(id){const p=P(id);if((cart[id]||0)+1>p.stock)return toast('สต็อกไม่พอ: '+p.name);cart[id]=(cart[id]||0)+1;cartUI()}
function qty(id,d){const n=(cart[id]||0)+d;if(n<=0)delete cart[id];else if(n>P(id).stock)return toast('สต็อกไม่พอ');else cart[id]=n;cartUI()}
function cartUI(){
 const e=Object.entries(cart);$('#cl').innerHTML=e.map(([id,n])=>{const p=P(id);return `<div class="ci"><span>${esc(p.name)}<br><small>฿${fmt(p.price)} × ${n}</small></span><button onclick="qty('${id}',-1)">−</button><b>${n}</b><button onclick="qty('${id}',1)">+</button></div>`}).join('')||'<p style="color:var(--m)">ยังไม่มีสินค้า</p>';
 $('#tt').textContent='฿'+fmt(cartTotal());$('#cbn').textContent='ตะกร้า ('+e.reduce((a,[,n])=>a+n,0)+')';$('#cbt').textContent='฿'+fmt(cartTotal());chg()}
function chg(){const r=+($('#rc')?.value||0),t=cartTotal();if($('#chg'))$('#chg').textContent=r?(r>=t?'เงินทอน ฿'+fmt(r-t):'ขาดอีก ฿'+fmt(t-r)):''}
function checkout(){
 const e=Object.entries(cart);if(!e.length)return toast('ยังไม่มีสินค้าในตะกร้า');
 const t=cartTotal(),r=+$('#rc').value||t,pay=$('#pay').value;if(pay=='เงินสด'&&r<t)return toast('รับเงินไม่พอ');
 const sale={id:'S'+Date.now(),date:new Date().toISOString(),items:e.map(([id,n])=>{const p=P(id);p.stock-=n;return{id,name:p.name,qty:n,price:p.price,cost:p.cost}}),total:t,pay,received:r};
 S.sales.push(sale);saveL();cart={};send({action:'sale',sale});
 toast(pay=='เงินสด'&&r>t?'ขายสำเร็จ เงินทอน ฿'+fmt(r-t):'ขายสำเร็จ ฿'+fmt(t));render()}
// ---------- ประวัติ / สรุปยอด ----------
function agg(l){const it={},pay={};let rev=0,cost=0,qty=0;l.forEach(s=>{rev+=+s.total;pay[s.pay]=(pay[s.pay]||0)+ +s.total;(s.items||[]).forEach(i=>{cost+=i.cost*i.qty;qty+=i.qty;const o=it[i.name]=it[i.name]||{n:i.name,q:0,r:0};o.q+=i.qty;o.r+=i.qty*i.price})});return{rev,cost,qty,bills:l.length,pay,top:Object.values(it).sort((a,b)=>b.r-a.r)}}
function vHist(){
 const l=S.sales.filter(s=>!hd||ymd(s.date)==hd).reverse().slice(0,300),a=agg(l);
 $('#app').innerHTML=`<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px"><label style="color:var(--m)">วันที่</label><input type="date" value="${hd}" onchange="hd=this.value;render()" style="width:auto"><button class="chip" onclick="hd='';render()">ทั้งหมด</button><span style="margin-left:auto">${l.length} บิล · <b>฿${fmt(a.rev)}</b></span></div>
 <div class="card wrap"><table><tr><th>วันที่</th><th>เลขที่บิล</th><th>รายการ</th><th>ชำระ</th><th>ยอดรวม</th></tr>${l.map(s=>`<tr><td>${new Date(s.date).toLocaleString('th-TH')}</td><td>${esc(s.id)}</td><td>${(s.items||[]).map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</td><td>${esc(s.pay)}</td><td><b>฿${fmt(s.total)}</b></td></tr>`).join('')||'<tr><td colspan=5>ไม่มีรายการขาย</td></tr>'}</table></div>`}
function vDash(){
 const key=dm=='day'?dd:dmo,l=S.sales.filter(s=>ymd(s.date).startsWith(key)),a=agg(l);let extra='';
 if(dm=='month'){const days={};l.forEach(s=>(days[ymd(s.date)]=days[ymd(s.date)]||[]).push(s));const rows=Object.keys(days).sort().map(k=>({k,...agg(days[k])})),mx=Math.max(1,...rows.map(r=>r.rev));
  extra=`<div class="card wrap" style="margin-bottom:18px"><h3 style="margin-top:0">สรุปรายวัน</h3><table><tr><th>วันที่</th><th>บิล</th><th>ยอดขาย</th><th>กำไร</th><th style="width:30%"></th></tr>${rows.map(r=>`<tr><td>${new Date(r.k+'T12:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short'})}</td><td>${r.bills}</td><td><b>฿${fmt(r.rev)}</b></td><td>฿${fmt(r.rev-r.cost)}</td><td><div class="bar"><i style="width:${r.rev/mx*100}%"></i></div></td></tr>`).join('')||'<tr><td colspan=5>ไม่มีข้อมูล</td></tr>'}</table></div>`}
 const low=S.products.filter(p=>p.stock<=5),val=S.products.reduce((x,p)=>x+p.stock*p.cost,0);
 $('#app').innerHTML=`<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px"><nav><button class="${dm=='day'?'on':''}" onclick="dm='day';render()">รายวัน</button><button class="${dm=='month'?'on':''}" onclick="dm='month';render()">รายเดือน</button></nav>
 ${dm=='day'?`<input type="date" value="${dd}" onchange="dd=this.value||dd;render()" style="width:auto">`:`<input type="month" value="${dmo}" onchange="dmo=this.value||dmo;render()" style="width:auto">`}</div>
 <div class="stats"><div class="st" style="--a:#10b981"><small>ยอดขาย</small><div>฿${fmt(a.rev)}</div></div><div class="st" style="--a:#4f46e5"><small>กำไร</small><div>฿${fmt(a.rev-a.cost)}</div></div><div class="st" style="--a:#8b5cf6"><small>จำนวนบิล</small><div>${a.bills}</div></div><div class="st" style="--a:#f59e0b"><small>จำนวนสินค้าที่ขาย</small><div>${a.qty}</div></div></div>${extra}
 <div class="two"><div class="card wrap"><h3 style="margin-top:0">สินค้าขายดี</h3><table><tr><th>สินค้า</th><th>จำนวน</th><th>ยอดขาย</th></tr>${a.top.slice(0,10).map(t=>`<tr><td>${esc(t.n)}</td><td>${t.q}</td><td>฿${fmt(t.r)}</td></tr>`).join('')||'<tr><td colspan=3>ไม่มีข้อมูล</td></tr>'}</table></div>
 <div class="card wrap"><h3 style="margin-top:0">ช่องทางชำระเงิน</h3><table>${Object.entries(a.pay).map(([k,v])=>`<tr><td>${esc(k)}</td><td><b>฿${fmt(v)}</b></td></tr>`).join('')||'<tr><td>ไม่มีข้อมูล</td></tr>'}</table>
 <h3>สต็อกคงคลัง</h3><div>มูลค่าตามต้นทุน <b>฿${fmt(val)}</b></div><div style="margin-top:8px">ใกล้หมด (≤ 5): ${low.map(p=>`<span class="tag" style="background:var(--w)">${esc(p.name)} (${p.stock})</span>`).join(' ')||'ไม่มี'}</div></div></div>`}
// ---------- สินค้า / สต็อก ----------
function vProd(){
 const p=edit?P(edit):{};
 $('#app').innerHTML=`<div class="card" style="margin-bottom:18px"><h3 style="margin-top:0">${edit?'แก้ไขสินค้า':'เพิ่มสินค้าใหม่'}</h3><div class="f">
 <div><label>ชื่อสินค้า</label><input id="n" value="${esc(p.name)}"></div><div><label>หมวดหมู่</label><input id="c" list="cl2" value="${esc(p.cat)}"><datalist id="cl2">${cats().slice(1).map(c=>`<option>${esc(c)}`).join('')}</datalist></div>
 <div><label>ราคาขาย</label><input id="pp" type="number" inputmode="decimal" value="${p.price??''}"></div><div><label>ต้นทุน</label><input id="co" type="number" inputmode="decimal" value="${p.cost??''}"></div>
 <div><label>${edit?'สต็อก (ปรับที่ปุ่ม สต็อก)':'สต็อกเริ่มต้น'}</label><input id="s" type="number" inputmode="numeric" value="${p.stock??''}" ${edit?'disabled':''}></div><div><label>หน่วย</label><input id="u" value="${esc(p.unit||'ชิ้น')}"></div>
 <div><label>รูปสินค้า (ไม่บังคับ)</label><input id="fi" type="file" accept="image/*"></div>
 <div style="display:flex;gap:6px"><button class="b g" onclick="saveP()">บันทึก</button>${edit?'<button class="b" onclick="edit=null;render()">ยกเลิก</button>':''}</div></div></div><div id="pt"></div>`;ptab()}
function ptab(){
 const el=$('#pt');if(!el)return;
 el.innerHTML=`<div class="card wrap" style="margin-bottom:18px"><table><tr><th>สินค้า</th><th>หมวด</th><th>ราคา</th><th>ต้นทุน</th><th>สต็อก</th><th></th></tr>${S.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td>฿${fmt(p.price)}</td><td>฿${fmt(p.cost)}</td><td><span class="tag" style="background:${p.stock<=0?'var(--bad)':p.stock<=5?'var(--w)':'var(--ok)'}">${p.stock} ${esc(p.unit)}</span></td><td style="white-space:nowrap"><button class="b o" onclick="stockDlg('${p.id}')">สต็อก</button> <button class="b" onclick="edit='${p.id}';render()">แก้ไข</button> <button class="b r" onclick="del('${p.id}')">ลบ</button></td></tr>`).join('')}</table></div>
 <div class="card wrap"><h3 style="margin-top:0">ประวัติปรับสต็อก</h3><table><tr><th>วันที่</th><th>สินค้า</th><th>ประเภท</th><th>จำนวน</th><th>คงเหลือ</th><th>หมายเหตุ</th></tr>${[...S.moves].reverse().slice(0,30).map(m=>`<tr><td>${new Date(m.date).toLocaleString('th-TH')}</td><td>${esc(m.name)}</td><td>${esc(m.type)}</td><td><b style="color:${m.qty>0?'var(--ok)':'var(--bad)'}">${m.qty>0?'+':''}${m.qty}</b></td><td>${m.after}</td><td>${esc(m.note)}</td></tr>`).join('')||'<tr><td colspan=6>ยังไม่มีประวัติ</td></tr>'}</table></div>`}
function stockDlg(id){
 const p=P(id),m=document.createElement('div');m.className='ov';m.onclick=e=>{if(e.target==m)m.remove()};
 m.innerHTML=`<div class="md"><h3>ปรับสต็อก</h3><p style="margin:0 0 12px"><b>${esc(p.name)}</b><br><small style="color:var(--m)">คงเหลือ ${p.stock} ${esc(p.unit)}</small></p><div class="f"><div><label>ประเภท</label><select id="sty"><option value="1">เพิ่มสต็อก (รับของเข้า)</option><option value="-1">ตัดสต็อก (เสียหาย/หมดอายุ/สูญหาย)</option></select></div><div><label>จำนวน (${esc(p.unit)})</label><input id="sq" type="number" min="1" inputmode="numeric" value="1"></div></div><div style="margin-top:10px"><label style="font-size:12px;color:var(--m)">หมายเหตุ</label><input id="sn" placeholder="เช่น รับของจากซัพพลายเออร์"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="b r" onclick="this.closest('.ov').remove()">ยกเลิก</button><button class="b g" onclick="doAdj('${p.id}')">บันทึก</button></div></div>`;document.body.appendChild(m)}
function doAdj(id){
 const p=P(id),sg=+$('#sty').value,n=Math.floor(+$('#sq').value);if(!(n>0))return toast('ใส่จำนวนให้ถูกต้อง');
 const delta=sg*n;if(p.stock+delta<0)return toast('ตัดเกินสต็อกที่มี');p.stock+=delta;
 const mv={id:'M'+Date.now(),date:new Date().toISOString(),pid:p.id,name:p.name,type:sg>0?'เพิ่ม':'ตัด',qty:delta,after:p.stock,note:$('#sn').value.trim()};
 S.moves.push(mv);saveL();send({action:'adjust',move:mv});$('.ov').remove();toast('บันทึกสต็อกแล้ว');ptab()}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,300/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)})}
async function upImg(img){try{const r=await(await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'image',name:Date.now()+'.jpg',mime:'image/jpeg',data:img.split(',')[1]})})).json();return r.url||null}catch(e){return null}}
async function saveP(){
 const name=$('#n').value.trim();if(!name||$('#pp').value==='')return toast('กรอกชื่อและราคา');
 let img=(edit&&P(edit).img)||'';const f=$('#fi').files[0];
 if(f){img=await shrink(f);if(API_URL){const u=await upImg(img);if(u)img=u}if(img.length>45000)img=''}
 const d={name,cat:$('#c').value.trim()||'ทั่วไป',price:+$('#pp').value,cost:+$('#co').value||0,unit:$('#u').value||'ชิ้น',img};let p;
 if(edit){p=P(edit);Object.assign(p,d)}else{p={id:'p'+Date.now(),...d,stock:+$('#s').value||0};S.products.push(p)}
 edit=null;saveL();send({action:'upsert',product:p});toast('บันทึกแล้ว');render()}
function del(id){if(confirm('ลบสินค้านี้?')){S.products=S.products.filter(p=>p.id!=id);saveL();send({action:'delete',id});ptab()}}
// ---------- ตรวจสอบการเชื่อมต่อ (แตะโลโก้ 3 ครั้ง) ----------
async function diag(){
 const rows=[],add=(ok,t,d='')=>rows.push(`<div class="dg"><i class="dot ${ok?'ok':'bad'}"></i><div><b>${t}</b><small>${d}</small></div></div>`);
 const m=document.createElement('div');m.className='ov';m.onclick=e=>{if(e.target==m)m.remove()};document.body.appendChild(m);
 const show=x=>m.innerHTML=`<div class="md"><h3>ตรวจสอบการเชื่อมต่อ</h3>${x}<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="b r" onclick="setApi()">เปลี่ยน URL</button><button class="b" onclick="this.closest('.ov').remove()">ปิด</button></div></div>`;
 show('<p>กำลังตรวจสอบ...</p>');
 add(!!API_URL,'ตั้งค่า URL Apps Script',API_URL?'ตั้งค่าแล้ว':'ยังไม่ได้ตั้งค่า');
 if(API_URL){try{const t=Date.now(),d=await(await fetch(API_URL)).json();add(true,'อ่านข้อมูลจากชีต','สินค้า '+d.products.length+' รายการ, บิลขาย '+d.sales.length+' รายการ ('+(Date.now()-t)+' ms)');
  try{const p=await(await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'ping'})})).json();add(!!p.ok,'ส่งข้อมูลไปยัง Apps Script (POST)',p.sheet?'ไฟล์ชีต: '+esc(p.sheet):'');
   if(p.folder===undefined)add(false,'Code.gs เวอร์ชันเก่า','วางโค้ดใหม่แล้ว Deploy เป็นเวอร์ชันใหม่');else add(!!p.folder,'โฟลเดอร์ Google Drive',p.folder?esc(p.folder):'เข้าถึงโฟลเดอร์ไม่ได้');
   add(Q.length==0,'คิวรอซิงค์',Q.length?Q.length+' รายการรอส่ง':'ไม่มีค้าง')}
  catch(e){add(false,'ส่งข้อมูลไปยัง Apps Script (POST)','ไม่สำเร็จ')}}
  catch(e){add(false,'อ่านข้อมูลจากชีต','เชื่อมต่อไม่ได้: ตรวจว่า Deploy เป็น Anyone และ URL ลงท้าย /exec')}}
 show(rows.join(''))}
load();
</script></body></html>
