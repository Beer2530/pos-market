<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>ร้านค้า POS</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fb;--c:#fff;--t:#111c33;--m:#6b7890;--b:#e8ecf4;--p:#4f46e5;--p2:#06b6d4;--ok:#10b981;--bad:#ef4444;--w:#f59e0b;--sh:0 1px 2px rgba(17,28,51,.04),0 6px 20px rgba(17,28,51,.05);--r:16px;--sw:236px}
@media(prefers-color-scheme:dark){:root{--bg:#0b1120;--c:#131c31;--t:#e8edf8;--m:#8d9bb5;--b:#222e49;--sh:0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}body{margin:0;font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:15px;-webkit-font-smoothing:antialiased}
svg.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---- โครงหน้า: แถบเมนูด้านข้าง (เดสก์ท็อป) / แถบล่าง (มือถือ) ---- */
header{position:fixed;left:0;top:0;bottom:0;width:var(--sw);z-index:12;background:var(--c);border-right:1px solid var(--b);padding:22px 16px;display:flex;flex-direction:column;gap:26px}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px}.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
.lg{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px #4f46e540}
header nav{display:flex;flex-direction:column;gap:4px}
header nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--m);padding:12px 14px;border-radius:12px;font:inherit;font-weight:500;cursor:pointer;transition:.15s;text-align:left}
header nav button:hover{background:var(--bg);color:var(--t)}
header nav button.on{background:linear-gradient(135deg,var(--p),#6d5ef5);color:#fff;box-shadow:0 8px 18px #4f46e540}
main{margin-left:var(--sw);padding:28px 36px 40px}main>*{max-width:1260px;margin-left:auto;margin-right:auto}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h2{margin:0;font-size:26px;font-weight:700;letter-spacing:.2px}.top p{margin:4px 0 0;color:var(--m)}.dt{color:var(--m);font-size:14px;background:var(--c);border:1px solid var(--b);padding:8px 14px;border-radius:99px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--m);display:inline-block;flex:none}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--w)}
/* ---- องค์ประกอบ ---- */
.card{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.card h3{font-size:16px;font-weight:700;margin:0 0 14px}
.pos{display:grid;grid-template-columns:1fr 380px;gap:22px}
input,select{font:inherit;padding:11px 13px;border:1px solid var(--b);border-radius:12px;background:var(--c);color:var(--t);width:100%;outline:0;transition:.15s}
input:focus,select:focus{border-color:var(--p);box-shadow:0 0 0 4px #4f46e51a}input:disabled{background:var(--bg);color:var(--m)}
.sr{position:relative}.sr svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--m)}.sr input{padding-left:44px;height:48px;box-shadow:var(--sh)}
button.b{background:var(--p);color:#fff;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
button.b:hover{filter:brightness(1.08)}button.b:active{transform:scale(.97)}
button.g{background:linear-gradient(135deg,#10b981,#059669)}button.r{background:#fee2e2;color:#dc2626}button.o{background:#fef3c7;color:#b45309}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.chip{padding:8px 18px;border-radius:99px;border:1px solid var(--b);background:var(--c);color:var(--m);cursor:pointer;font:inherit;font-weight:500;transition:.15s}
.chip:hover{border-color:var(--p);color:var(--p)}.chip.on{background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 6px 14px #4f46e535}
.seg{display:inline-flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px}.seg button{border:0;background:none;color:var(--m);padding:8px 18px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}.seg button.on{background:var(--c);color:var(--p);box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.pr{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:16px;cursor:pointer;box-shadow:var(--sh);transition:.18s;display:flex;flex-direction:column}
.pr:hover{transform:translateY(-3px);border-color:var(--p);box-shadow:0 14px 30px #4f46e51f}.pr:active{transform:scale(.98)}.pr.out{opacity:.45;pointer-events:none}
.ic{height:88px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}.ic img{max-height:88px;max-width:100%;border-radius:14px;object-fit:cover}
.tile{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;font-size:34px;font-weight:700;background:linear-gradient(135deg,hsl(var(--h) 90% 93%),hsl(var(--h) 80% 86%));color:hsl(var(--h) 55% 36%)}
.pr b{display:block;font-size:14px;font-weight:600;min-height:40px;line-height:1.35}.pr .p{color:var(--p);font-weight:700;font-size:19px;margin:6px 0 8px}
.pr small{color:var(--m);background:var(--bg);padding:3px 10px;border-radius:99px;align-self:flex-start;font-size:12px}.pr small.lw{background:#fef3c7;color:#b45309}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--m);font-weight:600;font-size:12.5px;text-align:left;padding:11px 14px;background:var(--bg)}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
td{padding:13px 14px;border-bottom:1px solid var(--b)}tbody tr:hover td,tr:hover>td{background:color-mix(in srgb,var(--bg) 60%,transparent)}tr:last-child td{border:0}td[colspan]{text-align:center;color:var(--m);padding:34px 14px}
.wrap{overflow-x:auto}td .b{padding:6px 12px;font-size:13px;border-radius:9px}
.cart{align-self:start;position:sticky;top:24px}
.ci{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px dashed var(--b)}.ci span{flex:1;font-size:14px;line-height:1.4}
.ci button{width:32px;height:32px;border-radius:10px;border:1px solid var(--b);background:var(--bg);color:var(--t);cursor:pointer;font-size:17px}
.tot{font-size:38px;font-weight:700;text-align:right;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.st{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:20px;box-shadow:var(--sh);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.st small{color:var(--m);font-weight:500;grid-column:1}.st div{font-size:28px;font-weight:700;grid-column:1;letter-spacing:.2px}
.si{grid-column:2;grid-row:1/3;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--a);background:color-mix(in srgb,var(--a) 14%,transparent)}.si svg{width:24px;height:24px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;margin-bottom:22px}
.bar{height:10px;background:var(--bg);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:9px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;align-items:end}.f label{font-size:12.5px;color:var(--m);font-weight:500;display:block;margin-bottom:5px}
.tag{padding:3px 11px;border-radius:99px;font-size:12px;color:#fff;font-weight:600;display:inline-block}
.ov{position:fixed;inset:0;background:#0b112099;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:40;padding:16px}.md{background:var(--c);border-radius:22px;padding:24px;width:min(480px,100%);box-shadow:0 30px 80px #0006}
.md h3{margin:0 0 14px}.dg{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--b);align-items:flex-start}.dg .dot{margin-top:6px}.dg small{display:block;color:var(--m)}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:12px 22px;border-radius:99px;display:none;z-index:50;box-shadow:0 10px 30px #0004;font-weight:500}
.cb,.xs{display:none}
@media(max-width:1100px){.pos{grid-template-columns:1fr 330px}}
@media(max-width:900px){
 :root{--sw:0px}
 header{position:sticky;width:auto;right:0;bottom:auto;flex-direction:row;padding:10px 16px;border-right:0;border-bottom:1px solid var(--b);background:color-mix(in srgb,var(--c) 88%,transparent);backdrop-filter:blur(12px)}
 header nav{position:fixed;left:0;right:0;bottom:0;z-index:12;flex-direction:row;background:var(--c);border-top:1px solid var(--b);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px}
 header nav button{flex:1;flex-direction:column;gap:3px;font-size:11.5px;padding:7px 2px;justify-content:center;align-items:center;text-align:center;border-radius:10px}
 header nav button svg{width:22px;height:22px}header nav button.on{background:color-mix(in srgb,var(--p) 12%,transparent);color:var(--p);box-shadow:none}
 main{margin-left:0;padding:16px 14px 150px}.top h2{font-size:21px}.dt{display:none}
 .pos{grid-template-columns:1fr}
 .cart{display:none;position:fixed;inset:auto 0 0 0;top:auto;z-index:20;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;box-shadow:0 -12px 50px #0006;padding-bottom:calc(20px + env(safe-area-inset-bottom))}.cart.open{display:block}
 .cb{display:flex;position:fixed;left:14px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:14;justify-content:space-between;align-items:center;padding:15px 20px;font-size:17px;border-radius:16px;box-shadow:0 10px 28px #4f46e566}.xs{display:block}
}
@media(max-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}input,select{font-size:16px}.tot{font-size:32px}.ci button{width:40px;height:40px}.md{padding:20px}.st div{font-size:24px}.card{padding:16px}}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:hidden;overscroll-behavior-y:none;touch-action:manipulation;min-height:100dvh}body.lock{overflow:hidden}
.card,.pos>*,.two>*{min-width:0}.pdfb{margin-left:auto;display:flex;gap:8px;align-items:center}
.rp{width:794px;height:1123px;background:#fff;color:#111827;padding:44px 52px;box-sizing:border-box;font-family:'Sarabun',sans-serif;position:relative;overflow:hidden;font-size:14px}
.rp .rh{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #4f46e5;padding-bottom:10px;margin-bottom:22px;font-size:15px}.rp .rh b{color:#4f46e5;font-size:18px}.rp .rh span{color:#6b7280}
.rp h2{margin:0 0 4px;font-size:26px}.rp .pd{margin:0 0 18px;color:#4b5563;font-size:15px}.rp h4{margin:20px 0 8px;font-size:15px;color:#3730a3}
.rp .rs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.rp .rs div{background:#eef2ff;border-radius:10px;padding:12px}.rp .rs small{display:block;color:#6b7280;font-size:12px}.rp .rs b{font-size:19px}
.rp table{width:100%;border-collapse:collapse;font-size:13px}.rp th{background:#eef2ff;color:#374151;padding:8px 10px;text-align:left;border-radius:0}.rp td{padding:7px 10px;border-bottom:1px solid #e5e7eb;color:#111827;background:#fff;line-height:1.35}
.rp .r{text-align:right}.rp .l{text-align:left}.rp .rf{position:absolute;left:52px;right:52px;bottom:28px;display:flex;justify-content:space-between;color:#9ca3af;font-size:12px}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr;gap:12px}.st{padding:14px}.si{width:38px;height:38px}.si svg{width:20px;height:20px}#toast{bottom:150px;max-width:90vw;text-align:center}.ov{align-items:end;padding:0}.md{border-radius:22px 22px 0 0;width:100%;max-height:90dvh;overflow:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom))}main{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}}
@media(max-width:1100px){main{padding:22px 20px 40px}}
@media(max-width:900px){main{padding-bottom:150px}}
</style>


</head><body>
<header><div class="brand" onclick="logo()" style="user-select:none"><span class="lg"><svg class="i" style="width:22px;height:22px" viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9c0 2 3 2 3 0M6 9c0 2 3 2 3 0M9 9c0 2 3 2 3 0M12 9c0 2 3 2 3 0M15 9c0 2 3 2 3 0M18 9c0 2 3 2 3 0"/></svg></span><h1>ร้านค้า POS</h1><i id="pend" class="dot warn" style="display:none" title="รอซิงค์"></i></div><nav id="nav"></nav></header>
<main><div class="top"><div><h2 id="ttl"></h2><p id="sub"></p></div><div class="dt" id="dt"></div></div><div id="app"></div></main><div id="toast"></div>
<script>
const DEFAULT_API='https://script.google.com/macros/s/AKfycbyA3SBusE0UrbshW2ZnQYvdg4ZCc4tRFHoCZfpmVyNqR5Ng2NENE5Mhdn_4B0XkIHBc/exec';
let API_URL=DEFAULT_API;try{API_URL=localStorage.getItem('pos_api')||DEFAULT_API}catch(e){}
const K='pos_v2',QK='pos_q';
let S={products:[],sales:[],moves:[]},cart={},cat='ทั้งหมด',tab='pos',q='',edit=null,Q=[],busy=0,dm='day',dd='',dmo='',hd='',lt=[];
const $=s=>document.querySelector(s),fmt=n=>(+n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
dd=ymd(new Date());dmo=dd.slice(0,7);
const IC={cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20.5 8H6"/>',receipt:'<path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',coin:'<circle cx="12" cy="12" r="9"/><path d="M9.5 6v12M9.5 8h4a2 2 0 0 1 0 4h-4m0 0h4.5a2 2 0 0 1 0 4H9.5"/>',trend:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'};
const I=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const seed=()=>[
{id:'p1',name:'ไข่ไก่ เบอร์ 2 (แผง 30 ฟอง)',cat:'ไข่',price:105,cost:90,stock:40,unit:'แผง',img:''},
{id:'p2',name:'ไข่ไก่ เบอร์ 3 (แผง 30 ฟอง)',cat:'ไข่',price:98,cost:84,stock:30,unit:'แผง',img:''},
{id:'p3',name:'ข้าวสาร หอมมะลิ 5 กก.',cat:'ข้าวสาร',price:185,cost:160,stock:25,unit:'ถุง',img:''},
{id:'p4',name:'ข้าวสาร หอมมะลิ 15 กก.',cat:'ข้าวสาร',price:520,cost:470,stock:12,unit:'ถุง',img:''},
{id:'p5',name:'น้ำดื่ม 600 มล.',cat:'น้ำดื่ม',price:7,cost:4.5,stock:120,unit:'ขวด',img:''},
{id:'p6',name:'น้ำดื่ม 1.5 ลิตร',cat:'น้ำดื่ม',price:14,cost:10,stock:60,unit:'ขวด',img:''},
{id:'p7',name:'น้ำดื่มแพ็ก 12 ขวด',cat:'น้ำดื่ม',price:68,cost:55,stock:4,unit:'แพ็ก',img:''}];
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2400)}
function setApi(){const u=prompt('วาง URL ของ Apps Script Web App (ลงท้าย /exec)\nเว้นว่างเพื่อใช้ค่าเริ่มต้น',API_URL);if(u===null)return;try{u.trim()?localStorage.setItem('pos_api',u.trim()):localStorage.removeItem('pos_api')}catch(e){}location.reload()}
function logo(){const n=Date.now();lt=lt.filter(t=>n-t<1500);lt.push(n);if(lt.length>=3){lt=[];diag()}}
// ---------- sync (คิวส่งข้อมูล + ดึงข้อมูลอัตโนมัติ) ----------
function saveL(){try{localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(QK,JSON.stringify(Q))}catch(e){}}
function pend(){const e=$('#pend');if(e)e.style.display=Q.length?'inline-block':'none'}
async function flush(){
 if(!API_URL||busy)return;busy=1;
 try{while(Q.length){const d=await(await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Q[0])})).json();if(!d.ok)throw 0;Q.shift();saveL();pend()}}
 catch(e){if(!flush.w||Date.now()-flush.w>30000){flush.w=Date.now();toast('ซิงค์ไม่สำเร็จ จะลองใหม่อัตโนมัติ')}}
 busy=0;pend()}
function send(a){if(!API_URL)return;Q.push(a);saveL();pend();flush()}
async function pull(first){
 if(!API_URL||busy||Q.length)return;
 try{const d=await(await fetch(API_URL)).json();
  const n={products:(d.products||[]).map(p=>({id:String(p.id),name:p.name,cat:p.cat,price:+p.price,cost:+p.cost,stock:+p.stock,unit:p.unit,img:p.img||''})),sales:d.sales||[],moves:d.moves||[]};
  if(first&&!n.products.length&&S.products.length){send({action:'seed',products:S.products});return}
  if(JSON.stringify(n)!=JSON.stringify(S)){S=n;saveL();refresh()}}catch(e){}}
const sync=()=>flush().then(()=>pull());
function refresh(){
 Object.keys(cart).forEach(id=>{const p=P(id);if(!p||p.stock<=0)delete cart[id];else if(cart[id]>p.stock)cart[id]=p.stock});
 if(tab=='pos'){grid();cartUI()}else if(tab=='prod')ptab();else render()}
async function load(){
 try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.products)S={moves:[],sales:[],...d};Q=JSON.parse(localStorage.getItem(QK)||'[]')}catch(e){}
 if(!S.products.length)S.products=seed();
 render();pend();
 if(API_URL){await flush();await pull(true);setInterval(sync,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});addEventListener('online',sync)}}
// ---------- helpers ----------
const hue=t=>[...String(t||'')].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
const icon=p=>/^(data:|http)/.test(p.img||'')?`<img src="${esc(p.img)}" alt="">`:`<span class="tile" style="--h:${hue(p.cat)}">${esc((String(p.name||'').match(/[ก-ฮA-Za-z0-9]/)||['?'])[0])}</span>`;
const cats=()=>['ทั้งหมด',...new Set(S.products.map(p=>p.cat).filter(Boolean))];
const P=id=>S.products.find(p=>p.id==id);
const cartTotal=()=>Object.entries(cart).reduce((s,[id,n])=>s+(P(id)?.price||0)*n,0);
function render(top){const y=scrollY;document.body.classList.remove('lock');

 const T={pos:['ขายสินค้า','เลือกสินค้าเข้าตะกร้าและรับชำระเงิน'],hist:['ประวัติการขาย','ดูบิลย้อนหลังและกรองตามวันที่'],dash:['สรุปยอดขาย','ยอดขาย กำไร และสินค้าขายดี รายวัน/รายเดือน'],prod:['สินค้า / สต็อก','เพิ่ม แก้ไขสินค้า และปรับสต็อก']}[tab];

async function diag(){

 const m=document.createElement('div');m.className='ov';m.onclick=e=>{if(e.target==m)m.remove()};document.body.appendChild(m);
 const show=x=>m.innerHTML=`<div class="md"><h3>ตรวจสอบการเชื่อมต่อ</h3>${x}<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="b r" onclick="setApi()">เปลี่ยน URL</button><button class="b" onclick="this.closest('.ov').remove()">ปิด</button></div></div>`;
 show('<p>กำลังตรวจสอบ...</p>');
 add(!!API_URL,'ตั้งค่า URL Apps Script',API_URL?'ตั้งค่าแล้ว':'ยังไม่ได้ตั้งค่า');
 if(API_URL){try{const t=Date.now(),d=await(await fetch(API_URL)).json();add(true,'อ่านข้อมูลจากชีต','สินค้า '+d.products.length+' รายการ, บิลขาย '+d.sales.length+' รายการ ('+(Date.now()-t)+' ms)');
  try{const p=await(await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'ping'})})).json();add(!!p.ok,'ส่งข้อมูลไปยัง Apps Script (POST)',p.sheet?'ไฟล์ชีต: '+esc(p.sheet):'');
   if(p.folder===undefined)add(false,'Code.gs เวอร์ชันเก่า','วางโค้ดใหม่แล้ว Deploy เป็นเวอร์ชันใหม่');else add(!!p.folder,'โฟลเดอร์ Google Drive',p.folder?esc(p.folder):'เข้าถึงโฟลเดอร์ไม่ได้');
   add(Q.length==0,'คิวรอซิงค์',Q.length?Q.length+' รายการรอส่ง':'ไม่มีค้าง')}
  catch(e){add(false,'ส่งข้อมูลไปยัง Apps Script (POST)','ไม่สำเร็จ')}}
  catch(e){add(false,'อ่านข้อมูลจากชีต','เชื่อมต่อไม่ได้: ตรวจว่า Deploy เป็น Anyone และ URL ลงท้าย /exec')}}
 show(rows.join(''))}
load();
